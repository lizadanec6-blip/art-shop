<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Art Gallery</title>

    <!-- ШРИФТИ -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ===================================== -->
    <!--        НЕРУХОМІ КВІТИ НА ФОНІ        -->
    <!-- ===================================== -->

    <div class="background-flowers">
      <!-- СПРАВА ЗВЕРХУ -->

      <img src="images/flowers.png" class="flower flower-top-right" alt="" />

      <!-- СПРАВА ЗНИЗУ -->

      <img src="images/flowers.png" class="flower flower-middle-right" alt="" />

      <!-- ЗЛІВА ЗНИЗУ -->

      <img src="images/flowers.png" class="flower flower-bottom-left" alt="" />
    </div>

    <!-- ===================================== -->
    <!--              ШАПКА САЙТУ             -->
    <!-- ===================================== -->

    <header class="header">
      <!-- ОСНОВНЕ МЕНЮ -->

      <nav class="navigation">
        <a href="index.html" data-lang="gallery"> Gallery </a>

        <a href="stock.html" class="active" data-lang="stock"> Stock </a>
      </nav>

      <!-- ================================= -->
      <!--           МЕНЮ ☰                 -->
      <!-- ================================= -->

      <div class="menu">
        <!-- прихований перемикач -->

        <input type="checkbox" id="menu-toggle" />

        <!-- кнопка ☰ -->

        <label for="menu-toggle" class="menu-button">
          <span></span>
          <span></span>
          <span></span>
        </label>

        <!-- БОКОВЕ МЕНЮ -->

        <div class="side-menu">
          <!-- закрити -->

          <label for="menu-toggle" class="close-menu"> × </label>

          <!-- автор -->

          <p class="menu-title" data-lang="author">Author</p>

          <!-- Instagram -->

          <p class="menu-text" data-lang="instagram">Instagram:</p>

          <a href="#" class="instagram"> @ovr.crime </a>

          <!-- мова -->

          <p class="language-title" data-lang="language">Change language</p>

          <div class="languages">
            <button type="button" onclick="changeLanguage('ua')">UA</button>

            <button type="button" onclick="changeLanguage('en')">US</button>
          </div>
        </div>
      </div>
    </header>

    <!-- ===================================== -->
    <!--      ПРОКРУЧУЄТЬСЯ ТІЛЬКИ ГАЛЕРЕЯ    -->
    <!-- ===================================== -->

    <main class="gallery-scroll">
      <div class="gallery">
        <!-- ===== КАРТИНА 1 ===== -->

        <a href="art1.html" class="art-card">
          <img src="images/art1.JPG" alt="Літо" />

          <p data-lang="art1-title">Summer</p>
        </a>

        <!-- ===== КАРТИНА 2 ===== -->

        <a href="art2.html" class="art-card">
          <img src="images/art2.PNG" alt="Назва картини" />

          <p data-lang="art1-title">Summer</p>
        </a>

        <!-- ===== КАРТИНА 3 ===== -->

        <a href="art3.html" class="art-card">
          <img src="images/art3.PNG" alt="Назва картини" />

          <p data-lang="art3-title">Still Life</p>
        </a>

        <!-- =================================
                 НАСТУПНІ КАРТИНИ БУДЕМО
                 ДОДАВАТИ СЮДИ
                 ================================= -->
      </div>
    </main>
    <script src="language.js"></script>
  </body>
</html>
